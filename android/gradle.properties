# ============ JVM OPTIMIZATIONS ============
# Disesuaikan agar stabil pada sistem dengan RAM 16GB atau kurang
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ============ ANDROIDX CONFIGURATION ============
android.useAndroidX=true
android.enableJetifier=true

# ============ BUILD & D8/R8 OPTIMIZATIONS ============
android.defaults.buildfeatures.buildconfig=true
# Properti pengganti untuk enableDexingArtifactTransform (WAJIB untuk AGP 8.3+)
android.useFullClasspathForDexingTransform=true
android.enableR8=true
android.injected.testOnly=false

# ============ KOTLIN OPTIMIZATIONS ============
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
kotlin.caching.enabled=true
kotlin.compiler.execution.strategy=in-process
kotlin.coroutines.enableBytecodeInstrumentation=true

# ============ MEMORY & WORKER OPTIMIZATIONS ============
org.gradle.workers.max=4

# ============ COMPATIBILITY CONFIGURATIONS ============
android.allowBackup=true
android.requestLegacyExternalStorage=true
android.enableMultiDex=true
android.packageNativeLibs=true
android.nonFinalResIds=false

# ============ SIGNING CONFIGURATION ============
android.injected.signing.ignore=false